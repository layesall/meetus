<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f5f7; color: #333; padding: 20px; }
    .card { background: #ffffff; padding: 30px; border-radius: 8px; max-width: 600px; margin: 0 auto; border-top: 4px solid #2563eb; }
    .info-box { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 6px; margin: 20px 0; }
    .meet-btn { display: inline-block; padding: 12px 20px; background-color: #2563eb; color: #ffffff !important; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Nouveau rendez-vous réservé !</h2>
    <p>Un nouveau rendez-vous a été confirmé sur <strong>MeetUs</strong>.</p>
    
    <div class="info-box">
      <p style="margin: 5px 0;"><strong>Client :</strong> {{ client_name }} ({{ client_email }})</p>
      <p style="margin: 5px 0;"><strong>Prestation :</strong> {{ event_title }}</p>
      <p style="margin: 5px 0;"><strong>Date & Heure :</strong> {{ start_time }}</p>
    </div>

    {% if meet_link %}
      <p><a href="{{ meet_link }}" class="meet-btn">Rejoindre la visio Google Meet</a></p>
    {% endif %}
  </div>
</body>
</html>
